# 丫丫计时器 — Nginx 配置
# 部署后放到 /etc/nginx/sites-available/yaya-timer
# 然后 ln -s /etc/nginx/sites-available/yaya-timer /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name _;   # 改成你的域名或 IP

    # 网站根目录（静态文件放这里）
    root /opt/yaya-timer;
    index index.html;

    # 静态文件直接由 Nginx 服务
    location / {
        try_files $uri $uri/ =404;
    }

    # API 请求反代到 Python
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # gzip 压缩（减小传输体积）
    gzip on;
    gzip_types text/html text/css application/javascript application/json;
    gzip_min_length 512;
}
